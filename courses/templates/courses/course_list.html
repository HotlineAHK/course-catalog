<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Каталог курсов</title></head>
<body>
  <h1>Каталог курсов</h1>
  <p><a href="{% url 'course_add' %}">Добавить курс</a></p>
  <ul>
    {% for course in courses %}
      <li>
        <strong>{{ course.title }}</strong> — мест: {{ course.seats }}<br>
        {{ course.description }}<br>
        <a href="{% url 'course_edit' course.pk %}">Редактировать</a>
      </li>
    {% empty %}
      <li>Курсов пока нет.</li>
    {% endfor %}
  </ul>
</body>
</html>
